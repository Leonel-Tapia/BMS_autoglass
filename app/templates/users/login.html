<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Autoglass | Login</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a192f;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: white;
            padding: 40px;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* ✅ Logo reducido para que se vea equilibrado */
        .logo {
            display: block;
            width: 100%;
            max-width: 180px;    /* Antes 280px — ahora más pequeño */
            height: auto;
            margin: 0 auto 25px auto;
            object-fit: contain;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #0a192f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #4a90e2;
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="{{ url_for('static', path='images/bms.jpg') }}" alt="BMS Autoglass Logo" class="logo">

        <form action="/auth/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <div class="footer-text">
        Project Started: 2026-09-22<br>
        Developed by Creative Ideas Marketing<br>
        Version: 2026.09.25 - 3:00 PM
    </div>

</body>
</html>
